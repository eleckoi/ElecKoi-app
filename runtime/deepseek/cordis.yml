# ElecKoi Android overlay for the official DSH sdk profile.
# The shipped dsh-base and dsh-sdk-app bundles own the runtime graph; this file
# only supplies Android policy and the per-session Agent Preset boundary.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: ''
    personaSuffix: ''

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImagesPerMessage: 4
    maxImageBytes: 20971520
    maxMessageImageBytes: 20971520
    normalizedImageMaxDimension: 2048
    normalizedImageMaxBytes: 4194304
    imageCompressionConcurrency: 2

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: zstd

- id: sandbox
  config:
    landlockPath: !!js process.env.DSH_LANDLOCK_PATH ?? '/opt/eleckoi/bin/landlock-run'

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: ask-for-approval
    presets:
      ask-for-approval:
        sandbox: read-only
        approval: ask
        name: 请求批准
        description: 修改文件或扩大工作区访问前询问
      approve-for-me:
        sandbox: workspace-write
        approval: ask
        name: 替我审批
        description: 工作区内自动执行，越界时询问
      full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全访问
        description: 不限制 DSH 文件访问且不询问

- id: sdk-jsonrpc-server
  # ElecKoi's SDK session-control patch adds model/resolve, whose handler reads
  # the official LLM registry. Keep the two upstream injections and declare the
  # extension's one additional dependency explicitly.
  inject:
    - sdkAppStartup
    - loader
    - llm
  config:
    maxTokensAsSuccess: true

# The SDK profile mounts model-facing tools process-wide. ElecKoi instead
# composes them per session through DSH Agent Presets, so the preset remains
# authoritative for every product tool switch and prompt surface.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: eleckoi-default
        includeShippedRoot: false
        includeUserRoot: true
